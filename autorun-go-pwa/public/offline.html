<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>本地服务未启动</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f2f2f7;
        --surface: #ffffff;
        --text: #0b0b0f;
        --muted: #5b5b66;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --surface: #1c1c1e;
          --text: #f5f5f7;
          --muted: #a1a1aa;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Manrope', 'SF Pro Display', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        padding: 28px;
        border-radius: 24px;
        background: var(--surface);
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
        text-align: left;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }
      .steps {
        margin-top: 18px;
        padding: 14px;
        border-radius: 16px;
        background: rgba(10, 132, 255, 0.08);
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--text);
      }
      img {
        width: 72px;
        height: 72px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/offline-image.svg" alt="本地服务未启动" />
      <h1>本地服务未启动</h1>
      <p>如果你是从 Windows 的 PWA 图标打开 AutoRun，浏览器应用本身不能拉起后端服务。</p>
      <div class="steps">
        请回到解压后的 AutoRun 文件夹，双击 <code>start-autorun.bat</code> 或 <code>autorun.exe</code> 启动。服务启动后页面会自动打开。
      </div>
    </div>
  </body>
</html>
